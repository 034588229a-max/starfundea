<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>員工打卡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Outfit:wght@600;800&display=swap">
<style>
/* HL-POS */ .tabs{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;overflow:visible!important}.tabs button{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;border-radius:20px!important;font-size:15px;font-weight:900;padding:10px 6px;white-space:normal;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.09)}.tabs button svg.hl-icon{width:28px;height:28px;margin:0}.btn{min-height:50px;border-radius:14px}

.ico{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

:root{--bg:#F2EEE6;--card:#fff;--ink:#16233A;--mute:#6B7486;--line:#E7E1D6;--pri:#1B4F8A;--acc:#E8762A;--onpri:#fff;--ok:#1E7D45;--bad:#C0392B;--warn:#B26A00;--field:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181F;--card:#1D232D;--ink:#EEF1F6;--mute:#9AA4B5;--line:#2B3340;--field:#161B23;--ok:#4CC37C;--bad:#FF7B6B;--warn:#E9B35A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181F;--card:#1D232D;--ink:#EEF1F6;--mute:#9AA4B5;--line:#2B3340;--field:#161B23;--ok:#4CC37C;--bad:#FF7B6B;--warn:#E9B35A;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Outfit',system-ui,sans-serif;font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 40px;max-width:560px;margin-inline:auto}
header{display:flex;align-items:center;gap:12px;padding-block:18px 10px}
header .dot{width:42px;height:42px;border-radius:12px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex:0 0 auto}
header h1{margin:0;font-size:19px;line-height:1.2}
header .sub{font-size:12.5px;color:var(--mute)}
header .out{margin-left:auto;border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;padding:8px;cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 1px 0 var(--line)}
.card h2{margin:0 0 8px;font-size:16px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
textarea{height:76px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.btn{display:block;width:100%;height:50px;border:0;border-radius:14px;background:var(--pri);color:var(--onpri);font:inherit;font-weight:900;font-size:17px;margin-top:14px;cursor:pointer}
.btn.acc{background:var(--acc);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{height:36px;font-size:13.5px;width:auto;padding:0 14px;margin:0;border-radius:10px}
.btn[disabled]{opacity:.55}
.tabs{display:flex;gap:6px;margin-top:6px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;border:0;background:var(--card);color:var(--mute);font:inherit;font-weight:700;padding:11px 14px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--onpri)}
.big{font-family:'Outfit','Noto Sans TC',sans-serif;font-weight:800;font-size:46px;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.date{text-align:center;color:var(--mute);margin-top:2px}
.shift{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:8px;font-weight:700}
.shift span{color:var(--mute);font-weight:400}
.msg{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:14px;display:none}
.msg.ok{display:block;background:rgba(30,125,69,.14);color:var(--ok)}
.msg.bad{display:block;background:rgba(192,57,43,.13);color:var(--bad)}
.msg.warn{display:block;background:rgba(178,106,0,.14);color:var(--warn)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li small{color:var(--mute);display:block;font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute);margin-left:6px}
.tag.late{background:rgba(192,57,43,.13);color:var(--bad)}.tag.ok{background:rgba(30,125,69,.14);color:var(--ok)}.tag.wait{background:rgba(178,106,0,.14);color:var(--warn)}
.hint{font-size:12.5px;color:var(--mute);margin-top:6px}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.day{font-weight:900;margin-top:12px;font-size:14px}
.docg{font-size:12.5px;font-weight:900;color:var(--mute);margin-top:14px;letter-spacing:.06em}
a.doc{color:inherit;text-decoration:none}
.hidden{display:none!important}
.pstat{margin-top:12px;padding:12px;border-radius:12px;text-align:center;font-weight:900;font-size:16px;background:var(--bg);color:var(--mute)}
.pstat.working{background:rgba(30,125,69,.14);color:var(--ok)}.pstat.done{background:rgba(27,79,138,.12);color:var(--pri)}
.rbox{margin-top:12px;padding:12px;border-radius:12px;background:rgba(178,106,0,.12)}.rtitle{font-weight:900;color:var(--warn);font-size:14px}
.rchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.rchips button{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.rchips button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.rbox input{margin-top:8px}
.annual{display:flex;justify-content:space-between;align-items:center;gap:10px}.annual b{font-family:'Outfit','Noto Sans TC',sans-serif;font-size:34px;line-height:1}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot">打</div>
  <div><h1 id="shop">員工打卡</h1><div class="sub" id="who"></div></div>
  <button class="out hidden" id="logout">登出</button>
</header>

<section id="login">
  <div class="card">
    <h2>員工登入</h2>
    <div class="hint" style="margin:0 0 6px">請用店長傳給你的「專屬連結」打開，就是你自己的畫面。換了手機或連結不見，可以在這裡登入。</div>
    <label for="emp">員工編號</label>
    <input id="emp" type="text" autocapitalize="characters" autocomplete="off" maxlength="8" placeholder="例如 E001（向店長索取）">
    <label for="pin">PIN（4～6 位數字）</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="你自己設定的 PIN">
    <button class="btn" id="go">登入</button>
    <div class="msg" id="lmsg"></div>
    <div class="hint">登入後這支手機會記住你。PIN 打錯 5 次會暫時鎖定 15 分鐘。為了保護隱私，這裡不會列出其他同事的名字。</div>
  </div>
</section>

<section id="home" class="hidden">
  <nav class="tabs" id="tabs">
    <button data-t="punch" data-ic="clock" class="on">打卡</button><button data-t="plan" data-ic="calendar">班表</button><button data-t="leave" data-ic="calendar-x">請假</button><button data-t="docs" data-ic="file-text">文件</button>
  </nav>

  <div id="t-punch">
    <div class="card">
      <div class="big" id="clk">--:--:--</div>
      <div class="date" id="dt"></div>
      <div id="todayShift"></div>
      <div class="pstat" id="pstat"></div>
      <div class="rbox hidden" id="rbox"><div class="rtitle" id="rtitle"></div><div class="rchips" id="rchips"></div><input id="rother" class="hidden" maxlength="30" placeholder="請寫原因（30 字內）"></div>
      <button class="btn acc" id="punch">打卡</button>
      <div class="msg" id="pmsg"></div>
    </div>
    <div class="card"><h2>最近的打卡</h2><div id="plist"></div></div>
  </div>

  <div id="t-plan" class="hidden"><div class="card"><h2>我的班表（未來 3 週）</h2><div id="planBody"></div></div><div class="card hidden" id="orderCard"><h2>今天要叫貨</h2><div id="orderBody"></div><div class="msg" id="orderMsg"></div></div><div class="card hidden" id="handCard"><h2>交接事項（還沒處理）</h2><div id="handBody"></div><div class="msg" id="handMsg"></div></div></div>

  <div id="t-leave" class="hidden">
    <div class="card"><h2>特休</h2><div id="annual"></div></div>
    <div class="card">
      <h2>我要請假</h2>
      <label for="lt">類別</label><select id="lt"></select>
      <div class="row"><div><label for="ls">開始日</label><input id="ls" type="date"></div><div><label for="le">結束日</label><input id="le" type="date"></div></div>
      <label for="lr">事由（選填）</label><textarea id="lr" maxlength="100"></textarea>
      <button class="btn" id="lsend">送出申請</button>
      <div class="msg" id="lmsg2"></div>
    </div>
    <div class="card"><h2>我的請假紀錄</h2><div id="llist"></div></div>
  </div>

  <div id="t-docs" class="hidden"><div class="card"><h2>工作守則・教育訓練・常用文件</h2><div id="docBody"></div><div class="msg" id="docMsg"></div></div></div>
</section>

<script>
const BOOT = <?!= boot ?>;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const KEY = 'stclock:' + (BOOT.sid || 'x');
let TOKEN = '', HOME = null, timer = null, offset = 0;

function run(fn, ...args) {
  return new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => bad(new Error((e && e.message) || String(e)))) [fn](...args));
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return ''; }
function show(el, cls, text) { el.className = 'msg ' + cls; el.textContent = text; }
function mdw(d) { const x = new Date(d + 'T00:00:00Z'); return (x.getUTCMonth() + 1) + '/' + x.getUTCDate() + '（' + WD[x.getUTCDay()] + '）'; }
function hm(mins) { return Math.floor(mins / 60) + ' 小時 ' + (mins % 60) + ' 分'; }
function relogin() { TOKEN = ''; store(KEY, null); $('home').classList.add('hidden'); $('logout').classList.add('hidden'); $('login').classList.remove('hidden'); $('who').textContent = ''; clearInterval(timer); }
function fail(e, box) {
  const m = e.message || String(e);
  if (/重新登入|失效|過期/.test(m)) { relogin(); show($('lmsg'), 'bad', m); return; }
  show(box, 'bad', m);
}

(function init() {
  const b = BOOT.brand || {};
  if (/^#[0-9A-Fa-f]{6}$/.test(b.primary || '')) { document.documentElement.style.setProperty('--pri', b.primary); const l = parseInt(b.primary.slice(1), 16), r = l >> 16, g = (l >> 8) & 255, bl = l & 255; document.documentElement.style.setProperty('--onpri', (0.299 * r + 0.587 * g + 0.114 * bl) > 150 ? '#16233A' : '#FFFFFF'); }
  if (/^#[0-9A-Fa-f]{6}$/.test(b.accent || '')) document.documentElement.style.setProperty('--acc', b.accent);
  $('shop').textContent = (b.name || '') + ' 員工打卡'; $('dot').textContent = (b.name || '打').slice(0, 1); document.title = (b.name || '') + '｜員工打卡';
  if (BOOT.tok) { TOKEN = BOOT.tok; store(KEY, TOKEN); }   /* 專屬連結：直接是本人 */
  else TOKEN = store(KEY);
  if (TOKEN) load();
})();

$('go').onclick = async () => {
  const id = $('emp').value.trim().toUpperCase(), pin = $('pin').value.trim();
  if (!/^E\d{3,}$/.test(id)) return show($('lmsg'), 'bad', '請填員工編號（例如 E001），不知道請問店長');
  if (!/^\d{4,6}$/.test(pin)) return show($('lmsg'), 'bad', 'PIN 是 4～6 位數字');
  $('go').disabled = true; show($('lmsg'), 'warn', '登入中…');
  try { const r = await run('stEmpLogin', BOOT.sid, id, pin); TOKEN = r.token; store(KEY, TOKEN); $('pin').value = ''; $('lmsg').className = 'msg'; await load(); }
  catch (e) { show($('lmsg'), 'bad', e.message); }
  $('go').disabled = false;
};
$('pin').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('logout').onclick = relogin;

async function load() {
  try {
    HOME = await run('stEmpHome', TOKEN);
    offset = 0;
    $('login').classList.add('hidden'); $('home').classList.remove('hidden'); $('logout').classList.remove('hidden');
    $('who').textContent = HOME.emp.name + (HOME.emp.title ? '・' + HOME.emp.title : '');
    draw();
    tick(); clearInterval(timer); timer = setInterval(tick, 1000);
  } catch (e) { relogin(); if (!/重新登入|失效|過期/.test(e.message)) show($('lmsg'), 'bad', e.message); else show($('lmsg'), 'bad', e.message); }
}

function tick() {
  const d = new Date(Date.now() + 8 * 3600e3), p = n => String(n).padStart(2, '0');
  $('clk').textContent = p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
  $('dt').textContent = d.getUTCFullYear() + '/' + p(d.getUTCMonth() + 1) + '/' + p(d.getUTCDate()) + '（週' + WD[d.getUTCDay()] + '）';
}

function draw() {
  const H = HOME, todays = H.shifts.filter(s => s.d === H.today);
  $('todayShift').innerHTML = todays.length ? todays.map(s => `<div class="shift"><b>今天的班：${esc(s.n)}</b><span>${esc(s.s)}–${esc(s.t)}</span></div>`).join('') : '<div class="shift"><b>今天沒有排班</b><span></span></div>';
  const open = H.open, S = H.status || { state: open ? 'working' : 'none' };
  $('punch').textContent = '打卡';
  $('punch').className = 'btn ' + (S.state === 'none' ? 'acc' : '');
  const ps = $('pstat'); ps.className = 'pstat ' + (S.state === 'working' ? 'working' : S.state === 'done' ? 'done' : '');
  ps.textContent = S.state === 'none' ? '今天還沒打卡' : S.state === 'working' ? (S.day && S.day !== H.today ? '上班中（' + mdw(S.day) + ' ' + S.in + ' 起）　下班時按一下' : '✓ 今日已打卡 ' + S.in + '　下班時再按一次') : '✓ 今日已完成　' + S.in + ' → ' + (S.out || '');
  /* 超過上班時間才打卡：要選補打卡原因（選項由店主設定，也能自己寫） */
  $('rbox').classList.toggle('hidden', !S.needReason);
  if (S.needReason) {
    $('rtitle').textContent = '已超過上班時間 ' + S.lateMins + ' 分鐘，請選補打卡原因：';
    $('rchips').innerHTML = (H.reasons || []).concat(['其他']).map(x => `<button type="button" data-r="${esc(x)}" class="${REASON === x ? 'on' : ''}">${esc(x)}</button>`).join('');
    $('rother').classList.toggle('hidden', REASON !== '其他');
  } else REASON = '';
  $('plist').innerHTML = H.punches.length ? H.punches.map(p => `<div class="li"><div><b>${esc(mdw(p.d))}</b><small>${esc(p.in)} → ${p.out ? esc(p.out) : '還沒下班'}${p.mins ? '・' + hm(p.mins) : ''}${p.reason ? '・補打卡：' + esc(p.reason) : ''}</small></div><div>${p.late ? `<span class="tag late">遲到 ${p.late} 分</span>` : (p.out ? '<span class="tag ok">正常</span>' : (p.missed ? '<span class="tag late">忘了下班</span>' : '<span class="tag wait">上班中</span>'))}</div></div>`).join('') : '<div class="empty">還沒有打卡紀錄</div>';
  const A = H.annual;
  $('annual').innerHTML = A && A.ok ? `<div class="annual"><div><small style="color:var(--mute)">特休剩餘（到職日 ${esc(A.hired)}，年資 ${A.years} 年）</small><div><b>${A.left}</b> 天　<span style="color:var(--mute)">共 ${A.days} 天・已休 ${A.used} 天</span></div></div></div><div class="hint">依勞動基準法第 38 條計算（${esc(A.from)} ～ ${esc(A.to)} 這一年度）。</div>` : '<div class="hint">店長還沒填你的到職日，所以還算不出特休天數。</div>';
  const OR = H.orders || { today: [], overdue: [] }, od = OR.today.concat(OR.overdue);
  $('orderCard').classList.toggle('hidden', !od.length);
  $('orderBody').innerHTML = od.map(o => `<div class="li"><div><b>${esc(o.name)}</b>${OR.overdue.indexOf(o) >= 0 ? ' <span class="tag late">昨天沒叫</span>' : ''}<small>${esc(o.time)} 前</small></div><div>${o.done ? '<span class="tag ok">✓ 已叫貨 ' + esc(o.at) + '</span>' : `<button class="btn sm" data-od="${esc(o.vid)}">已叫貨</button>`}</div></div>`).join('');
  $('handCard').classList.toggle('hidden', !(H.hand && H.hand.length));
  $('handBody').innerHTML = (H.hand || []).map(h => `<div class="li"><div><b>[${esc(h.prio)}] ${esc(mdw(h.day))} ${esc(h.shift)}</b>${h.mine ? ' <span class="tag late">交給你</span>' : ''}<small>${esc(h.who)}：${esc(h.text)}</small></div><div><button class="btn sm" data-hd="${esc(h.id)}">處理完成</button></div></div>`).join('');
  const by = {}; H.shifts.forEach(s => (by[s.d] = by[s.d] || []).push(s));
  const days = Object.keys(by);
  $('planBody').innerHTML = days.length ? days.map(d => `<div class="day">${esc(mdw(d))}${d === H.today ? '（今天）' : ''}</div>` + by[d].map(s => `<div class="shift"><b>${esc(s.n)}</b><span>${esc(s.s)}–${esc(s.t)}${s.note ? '・' + esc(s.note) : ''}</span></div>`).join('')).join('') : '<div class="empty">未來 3 週還沒有排班</div>';
  $('lt').innerHTML = H.leaveTypes.map(t => `<option>${esc(t)}</option>`).join('');
  if (!$('ls').value) { $('ls').value = H.today; $('le').value = H.today; }
  const st = { '待審': 'wait', '核准': 'ok', '駁回': 'late', '已取消': '' };
  $('llist').innerHTML = H.leaves.length ? H.leaves.map(l => `<div class="li"><div><b>${esc(l.type)}　${esc(mdw(l.start))}${l.end !== l.start ? ' ～ ' + esc(mdw(l.end)) : ''}</b><small>${esc(l.reason || '')}${l.reply ? '　店長回覆：' + esc(l.reply) : ''}</small></div><div><span class="tag ${st[l.status] || ''}">${esc(l.status)}</span>${l.status === '待審' ? ` <button class="btn sm ghost" data-cancel="${esc(l.id)}">取消</button>` : ''}</div></div>`).join('') : '<div class="empty">還沒有請假紀錄</div>';
  const g = {}; H.docs.forEach(d => (g[d.cat] = g[d.cat] || []).push(d));
  const cats = Object.keys(g);
  $('docBody').innerHTML = cats.length ? cats.map(c => { const n = g[c].filter(d => d.read).length, prog = ['工作守則', '教育訓練'].indexOf(c) >= 0 ? `<span class="tag ${n === g[c].length ? 'ok' : 'wait'}">已完成 ${n}／${g[c].length}</span>` : ''; return `<div class="docg">${esc(c)} ${prog}</div>` + g[c].map(d => `<div class="li"><a class="doc" href="${esc(d.url)}" target="_blank" rel="noopener" style="flex:1;min-width:0"><div><b>${esc(d.title)}</b>${d.must ? ' <span class="tag late">必讀</span>' : ''}<small>${esc(d.name)}・${d.kb} KB</small></div></a>${d.read ? '<span class="tag ok">✓ 已完成</span>' : `<button class="btn sm" data-dr="${esc(d.id)}">我看完了</button>`}</div>`).join(''); }).join('') : '<div class="empty">店家還沒有放文件</div>';
}

$('tabs').onclick = e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['punch', 'plan', 'leave', 'docs'].forEach(t => $('t-' + t).classList.toggle('hidden', t !== b.dataset.t));
};

let REASON = '';
$('rchips').onclick = e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  REASON = b.dataset.r; draw(); if (REASON === '其他') $('rother').focus();
};
$('punch').onclick = async () => {
  const S = HOME.status || {};
  let why = '';
  if (S.needReason) {
    why = REASON === '其他' ? $('rother').value.trim() : REASON;
    if (!why) return show($('pmsg'), 'warn', REASON === '其他' ? '請寫一下原因' : '已超過上班時間，請先選一個補打卡原因');
  }
  $('punch').disabled = true; show($('pmsg'), 'warn', '打卡中…');
  try {
    const r = await run('stPunch', TOKEN, '', why);
    show($('pmsg'), r.warn ? 'warn' : 'ok', '打卡成功 ' + r.time + (r.from ? '（從 ' + r.from + ' 開始）' : '') + (r.reason ? '　補打卡原因：' + r.reason : '') + (r.warn ? '　' + r.warn : ''));
    REASON = ''; $('rother').value = '';
    HOME = await run('stEmpHome', TOKEN); draw();
  } catch (e) { fail(e, $('pmsg')); }
  $('punch').disabled = false;
};

$('lsend').onclick = async () => {
  $('lsend').disabled = true; show($('lmsg2'), 'warn', '送出中…');
  try {
    await run('stLeaveSubmit', TOKEN, { type: $('lt').value, start: $('ls').value, end: $('le').value, reason: $('lr').value });
    $('lr').value = ''; show($('lmsg2'), 'ok', '已送出，等店長審核');
    HOME = await run('stEmpHome', TOKEN); draw();
  } catch (e) { fail(e, $('lmsg2')); }
  $('lsend').disabled = false;
};
$('ls').onchange = () => { if ($('le').value < $('ls').value) $('le').value = $('ls').value; };
$('llist').onclick = async e => {
  const b = e.target.closest('[data-cancel]'); if (!b) return;
  b.disabled = true;
  try { await run('stLeaveCancel', TOKEN, b.dataset.cancel); HOME = await run('stEmpHome', TOKEN); draw(); show($('lmsg2'), 'ok', '已取消'); }
  catch (er) { fail(er, $('lmsg2')); }
};
