<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

:root { --bg: #F2EEE6; --card: #fff; --ink: #16233A; --mute: #6B7280; --line: #E5E0D6; --navy: #1B4F8A; --orange: #E8762A; --field: #F7F5F0; --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif }
@media (prefers-color-scheme: dark) { :root { --bg: #14171d; --card: #1d222b; --ink: #eef0f4; --mute: #a3aab8; --line: #2e3542; --navy: #8fb6ea; --orange: #F4A259; --field: #262c37 } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.55 }
.wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 60px }
h1 { margin: 0; font-size: 21px; font-weight: 900; color: var(--navy) }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px }
.card { background: var(--card); border-radius: 18px; padding: 14px; box-shadow: 0 6px 18px rgba(22,35,58,.06); margin-bottom: 12px }
input, select, textarea { width: 100%; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--field); color: var(--ink); padding: 0 10px; font: inherit; font-size: 15px }
label { display: block; font-size: 12.5px; font-weight: 700; margin-top: 10px }
label input, label select { margin-top: 4px }
.btn { height: 38px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); color: var(--navy); font: inherit; font-weight: 700; padding: 0 12px; cursor: pointer }
.btn.pri { background: var(--orange); color: #fff; border-color: var(--orange) }
.btn.dng { color: #c0392b }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end }
.row > * { flex: 1; min-width: 120px }
.row > .btn { flex: none }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 }
.chip { border: 0; border-radius: 999px; padding: 4px 11px; background: var(--field); color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer }
.chip.on { background: var(--navy); color: #fff }
table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top }
th { color: var(--mute); font-size: 12px }
tr.sel td { background: var(--field) }
tr.shop { cursor: pointer }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--field) }
.tag.ok { background: #DDF1E4; color: #1f6b3a } .tag.warn { background: #FFE9CC; color: #9a5a00 } .tag.bad { background: #F8D7DA; color: #7a1c24 }
.msg { font-size: 13.5px; min-height: 20px; margin: 6px 0; color: var(--mute) } .msg.bad { color: #c0392b } .msg.ok { color: #2e7d4f }
.hide { display: none }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr } th:nth-child(n+4), td:nth-child(n+4) { display: none } }
.small { font-size: 12.5px; color: var(--mute) }
h3 { margin: 0 0 6px; font-size: 16px }
.otp { letter-spacing: 8px; text-align: center; font-size: 22px; font-weight: 900 }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="ttl">管理後台</h1><div><span class="small" id="who"></span> <button class="btn hide" id="logout" data-ic="log-out">登出</button></div></div>

  <div id="login" class="card hide" style="max-width:380px">
    <h3>管理員登入</h3>
    <label>管理員 Email<input id="aMail" type="email" autocomplete="email"></label>
    <div id="otpBox" class="hide"><label>驗證碼<input id="aOtp" class="otp" inputmode="numeric" maxlength="6"></label></div>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="aSend" data-ic="mail">寄送驗證碼</button><button class="btn pri hide" id="aVerify" data-ic="log-in">登入</button></div>
    <div class="msg" id="aMsg"></div>
  </div>

  <div id="main" class="hide">
    <div class="card">
      <div class="row">
        <div><b id="sum"></b><div class="small" id="quota"></div></div>
        <input id="q" placeholder="搜尋店名、統編、Email">
        <button class="btn pri" id="newBtn" data-ic="plus">新增店家</button>
      </div>
      <div class="chips" id="chips"></div>
      <div style="overflow-x:auto"><table><thead><tr><th>店家</th><th>統編</th><th>狀態</th><th>方案</th><th>到期日</th><th>最後使用</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>

    <div class="card hide" id="detail">
      <div class="row"><h3 id="dName" style="flex:3"></h3><button class="btn" id="dClose" data-ic="x">關閉</button></div>
      <div class="msg" id="dMsg"></div>
      <div class="grid2">
        <label>公司名稱<input id="fName"></label>
        <label>統一編號（不可改）<input id="fTax" disabled></label>
        <label>負責人<input id="fOwner"></label>
        <label>登入 Email（驗證碼寄到這裡）<input id="fMail"></label>
        <label>方案<select id="fPlan"></select></label>
        <label>備註<input id="fNote"></label>
        <label>改公司名稱的審核說明（名稱鎖定期間才需要）<input id="fReason" placeholder="例如：已核對負責人本人與變更登記資料"></label>
        <label class="hide" id="fSkipW"><input type="checkbox" id="fSkip" style="width:auto;height:auto"> 略過統編檢查碼</label>
        <label class="hide" id="fStartW">開通方式<select id="fStart"><option value="pending">待付款（付款後才能登入）</option><option value="pilot">試營運 30 天（全功能，輸出不加浮水印）</option></select></label>
        <div class="small hide" id="fStartN">建立後會寄「開通信」到登入 Email，店主用驗證碼自己設定密碼；後台看不到、也不會寄出密碼。</div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="dSave" data-ic="check">儲存資料</button></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <div id="ctl">
        <h3>授權</h3>
        <div class="small" id="lic"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn" data-ext="30">延長 30 天</button><button class="btn" data-ext="365">延長 1 年</button>
          <label style="margin:0">到期日<input id="dExp" type="date"></label><button class="btn" id="dExpSave">改到期日</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn" data-st="active">恢復（使用中）</button><button class="btn" id="dPilot" data-ic="calendar-check">開始試營運 30 天</button><button class="btn dng" data-st="suspended">停權</button>
          <button class="btn" id="dProv" data-ic="package">建立試算表與資料夾</button><button class="btn" id="dAct" data-ic="mail">重寄開通信</button><button class="btn" id="dReset" data-ic="lock">要求重設密碼（寄信）</button><button class="btn" id="dRevoke" data-ic="log-out">強制登出</button>
        </div>
        <h3 style="margin-top:14px">收款（人工）</h3>
        <div class="row">
          <label style="margin:0">方案<select id="pPlan"></select></label>
          <label style="margin:0">週期<select id="pCycle"><option value="month">月繳</option><option value="year">年繳</option></select></label>
          <label style="margin:0">金額（空白＝依方案）<input id="pAmt" inputmode="numeric"></label>
          <label style="margin:0">備註<input id="pNote"></label>
          <button class="btn pri" id="pPaid" data-ic="banknote">已收款，延長</button>
        </div>
      </div>
      <h3 style="margin-top:14px">夥伴</h3><div id="partners" class="small"></div>
      <h3 style="margin-top:14px">付款紀錄</h3><div style="overflow-x:auto"><table><tbody id="pays"></tbody></table></div>
      <h3 style="margin-top:14px">最近紀錄</h3><div style="overflow-x:auto"><table><tbody id="logs"></tbody></table></div>
    </div>
  </div>
</div>

<script>
const BOOT = <?!= boot ?>;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HAS_GS = !!(window.google && google.script && google.script.run);
function call(fn, ...a) { return new Promise((ok, no) => { if (!HAS_GS) return no(new Error('請從正式網址打開')); google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a); }); }
const errText = e => String((e && e.message) || e || '發生錯誤').replace(/^Error:\s*/, '');
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
function msg(id, t, c) { const el = $(id); el.textContent = t || ''; el.className = 'msg' + (c ? ' ' + c : ''); }
let TOK = BOOT.token || store('hl-admin'), DATA = null, SEL = null, FILTER = '';
$('ttl').textContent = BOOT.product + '｜管理後台';

/* 呼叫後台函式：通行證過期就回登入畫面 */
async function adm(fn, ...a) {
  try { return await call(fn, TOK, ...a); }
  catch (e) { if (/登入|過期|權限/.test(errText(e))) { store('hl-admin', null); TOK = ''; showLogin(); } throw e; }
}
function showLogin() { $('login').classList.remove('hide'); $('main').classList.add('hide'); $('logout').classList.add('hide'); }

$('aSend').onclick = async () => {
  msg('aMsg', '');
  try { const r = await call('admStart', $('aMail').value); if (!r.ok) { msg('aMsg', r.msg, 'bad'); return; }
    $('otpBox').classList.remove('hide'); $('aSend').classList.add('hide'); $('aVerify').classList.remove('hide'); msg('aMsg', '如果這個 Email 是管理員，驗證碼已寄出。', 'ok'); }
  catch (e) { msg('aMsg', errText(e), 'bad'); }
};
$('aVerify').onclick = async () => {
  msg('aMsg', '');
  try { const r = await call('admVerify', $('aMail').value, $('aOtp').value); if (!r.ok) { msg('aMsg', r.msg, 'bad'); return; }
    TOK = r.token; store('hl-admin', TOK); $('who').textContent = $('aMail').value; $('login').classList.add('hide'); load(); }
  catch (e) { msg('aMsg', errText(e), 'bad'); }
};
$('logout').onclick = () => { store('hl-admin', null); TOK = ''; showLogin(); };

const TAG = s => ({ '使用中': 'ok', '試用': 'ok', '試營運': 'ok', '寬限': 'warn', '唯讀': 'warn', '停用': 'bad', '待啟用': 'warn' }[s] || '');
async function load() {
  try { DATA = await adm('admOverview'); } catch (e) { return; }
  $('main').classList.remove('hide'); $('logout').classList.remove('hide');
  $('sum').textContent = '共 ' + DATA.shops.length + ' 家店';
  $('quota').textContent = DATA.quota != null ? '今日剩餘寄信額度：' + DATA.quota + ' 封（一般 Gmail 每天 100 封）' : '';
  const opts = Object.keys(DATA.plans).map(k => `<option value="${k}">${esc(DATA.plans[k].name)}</option>`).join('');
  $('fPlan').innerHTML = opts; $('pPlan').innerHTML = opts.replace(/<option value="trial">[^<]*<\/option>/, '');
  render();
}
function render() {
  const cs = DATA.counts, labels = Object.keys(cs);
  $('chips').innerHTML = `<button class="chip${FILTER ? '' : ' on'}" data-f="">全部</button>` + labels.map(l => `<button class="chip${FILTER === l ? ' on' : ''}" data-f="${esc(l)}">${esc(l)} ${cs[l]}</button>`).join('');
  const q = $('q').value.trim().toLowerCase();
  const list = DATA.shops.filter(s => (!FILTER || s.statusLabel === FILTER) && (!q || (s.name + s.taxId + s.email + s.id).toLowerCase().includes(q)));
  $('rows').innerHTML = list.map(s => `<tr class="shop${SEL === s.id ? ' sel' : ''}" data-id="${esc(s.id)}"><td><b>${esc(s.name)}</b><div class="small">${esc(s.id)}</div></td><td>${esc(s.taxId)}</td><td><span class="tag ${TAG(s.statusLabel)}">${esc(s.statusLabel)}</span></td><td>${esc(s.planName)}</td><td>${esc(s.expires || '—')}${s.daysLeft != null && s.daysLeft <= 7 ? '<div class="small">' + (s.daysLeft >= 0 ? '剩 ' + s.daysLeft + ' 天' : '已過 ' + (-s.daysLeft) + ' 天') + '</div>' : ''}</td><td class="small">${esc(s.lastUsed || '—')}</td></tr>`).join('') || '<tr><td colspan="6" class="small">沒有符合的店家</td></tr>';
}
$('chips').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { FILTER = b.dataset.f; render(); } };
$('q').oninput = render;
$('rows').onclick = e => { const tr = e.target.closest('tr.shop'); if (tr) open(tr.dataset.id); };

async function open(id) {
  SEL = id; render(); msg('dMsg', '');
  try {
    const r = await adm('admShop', id); if (!r.ok) { msg('dMsg', r.msg, 'bad'); return; }
    const s = r.shop;
    $('detail').classList.remove('hide'); $('ctl').classList.remove('hide'); $('fTax').disabled = true;
    $('dName').textContent = s.name + '（' + s.id + '）';
    $('fName').value = s.name; $('fTax').value = s.taxId; $('fOwner').value = s.owner; $('fMail').value = s.email; $('fPlan').value = s.plan; $('fNote').value = s.note; $('fReason').value = ''; $('fSkipW').classList.add('hide'); $('fStartW').classList.add('hide'); $('fStartN').classList.add('hide');
    $('lic').innerHTML = `狀態：<b>${esc(s.statusLabel)}</b>｜到期日：<b>${esc(s.expires || '—')}</b>｜名稱鎖定至：${esc(s.nameLock || '—')}｜Email 已驗證：${s.verified ? '是' : '否'}｜試算表：${s.ssId ? '<a href="https:' + '/' + '/docs.google.com/spreadsheets/d/' + esc(s.ssId) + '" target="_blank">開啟</a>' : '尚未建立'}${s.msg ? '<br>' + esc(s.msg) : ''}`;
    $('dExp').value = s.expires || ''; $('pPlan').value = s.plan === 'trial' ? 'pro' : s.plan;
    $('partners').innerHTML = r.partners.length ? r.partners.map(p => `${esc(p.name)}（${esc(p.status)}${p.lastUsed ? '，最後使用 ' + esc(p.lastUsed) : ''}）<button class="btn" data-pt="${esc(p.id)}" data-to="${p.status === '停用' ? '使用中' : '停用'}" style="height:28px;margin-left:6px">${p.status === '停用' ? '啟用' : '停用'}</button>`).join('<br>') : '尚無夥伴';
    $('pays').innerHTML = r.pays.map(p => `<tr><td>${esc(p.created)}</td><td>${esc(p.plan)}/${esc(p.cycle)}</td><td>${p.amount} 元</td><td>${esc(p.provider)}</td><td><span class="tag ${p.status === '已付款' ? 'ok' : p.status === '失敗' ? 'bad' : 'warn'}">${esc(p.status)}</span></td><td>${esc(p.from)} ～ ${esc(p.to)}</td></tr>`).join('') || '<tr><td class="small">沒有付款紀錄</td></tr>';
    $('logs').innerHTML = r.logs.map(l => `<tr><td class="small">${esc(l.at)}</td><td>${esc(l.who)}</td><td>${esc(l.act)}</td><td>${esc(l.res)}</td><td class="small">${esc(l.note)}</td></tr>`).join('') || '<tr><td class="small">沒有紀錄</td></tr>';
    $('detail').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { msg('dMsg', errText(e), 'bad'); }
}
$('dClose').onclick = () => { SEL = null; $('detail').classList.add('hide'); render(); };

async function act(fn, ...a) {
  msg('dMsg', '處理中…');
  try { const r = await adm(fn, ...a); if (r && r.ok === false) { msg('dMsg', r.msg, 'bad'); return null; } await load(); if (SEL) await open(SEL); msg('dMsg', '完成', 'ok'); return r; }
  catch (e) { msg('dMsg', errText(e), 'bad'); return null; }
}
$('ctl').onclick = e => {
  const x = e.target.closest('[data-ext]'); if (x) return act('admExtend', SEL, +x.dataset.ext);
  const s = e.target.closest('[data-st]'); if (s) return act('admSetStatus', SEL, s.dataset.st);
};
$('dExpSave').onclick = () => act('admSetExpiry', SEL, $('dExp').value);
$('dProv').onclick = () => act('admProvision', SEL);
$('dReset').onclick = () => act('admResetPw', SEL);
$('dPilot').onclick = () => act('admPilot', SEL);
$('dAct').onclick = () => act('admActMail', SEL);
$('dRevoke').onclick = () => act('admRevoke', SEL);
$('pPaid').onclick = () => act('admMarkPaid', SEL, { plan: $('pPlan').value, cycle: $('pCycle').value, amount: $('pAmt').value, note: $('pNote').value });
$('partners').onclick = e => { const b = e.target.closest('[data-pt]'); if (b) act('admPartnerSet', b.dataset.pt, b.dataset.to); };
$('dSave').onclick = async () => {
  if (SEL) { await act('admSaveShop', { id: SEL, name: $('fName').value, taxId: $('fTax').value, owner: $('fOwner').value, email: $('fMail').value, plan: $('fPlan').value, note: $('fNote').value, reason: $('fReason').value }); return; }
  msg('dMsg', '處理中…');
  try {
    const r = await adm('admSaveShop', { name: $('fName').value, taxId: $('fTax').value, owner: $('fOwner').value, email: $('fMail').value, plan: $('fPlan').value, note: $('fNote').value, skipTaxCheck: $('fSkip').checked, start: $('fStart').value });
    if (!r.ok) { msg('dMsg', r.msg, 'bad'); return; }
    await load(); await open(r.shop.id);
    msg('dMsg', '已建立（' + r.shop.statusLabel + '）。' + (r.mailed ? '開通信已寄到 ' + r.mail + '，店主會自己設定密碼。' : '開通信沒有寄出，請按「重寄開通信」。'), r.mailed ? 'ok' : 'bad');
  } catch (e) { msg('dMsg', errText(e), 'bad'); }
};
$('newBtn').onclick = () => {
  SEL = null; render(); msg('dMsg', '');
  $('detail').classList.remove('hide'); $('ctl').classList.add('hide'); $('dName').textContent = '新增店家';
  ['fName', 'fOwner', 'fMail', 'fNote', 'fReason'].forEach(i => $(i).value = ''); $('fTax').disabled = false; $('fTax').value = ''; $('fSkipW').classList.remove('hide'); $('fStartW').classList.remove('hide'); $('fStartN').classList.remove('hide'); $('fStart').value = 'pending'; $('fPlan').value = 'pro';
  $('partners').innerHTML = ''; $('pays').innerHTML = ''; $('logs').innerHTML = '';
};

(function start() {
  if (TOK) { $('who').textContent = ''; load().catch(() => {}); } else showLogin();
})();
</script>

   圖形來源：Lucide v0.460.0（ISC 授權，可商用；Copyright (c) Lucide Contributors，部分源自 Feather，MIT）。

    'egg': '<path d="M12 22c6.23-.05 7.87-5.57 7.5-10-.36-4.34-3.95-9.96-7.5-10-3.55.04-7.14 5.66-7.5 10-.37 4.43 1.27 9.95 7.5 10z"/>',
