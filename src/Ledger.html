<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>店務收支</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

:root{--bg:#EEF1F6;--card:#fff;--ink:#16233A;--mute:#6B7486;--line:#DCE2EB;--pri:#1B4F8A;--acc:#E8762A;--onpri:#fff;--ok:#1E7D45;--bad:#C0392B;--in:#1E7D45;--out:#C0392B;--field:#fff;--key:#F4F6FA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151D;--card:#1B222D;--ink:#EEF1F6;--mute:#9AA4B5;--line:#2B3441;--field:#141A23;--key:#232C39;--ok:#4CC37C;--bad:#FF7B6B;--in:#4CC37C;--out:#FF8A7A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151D;--card:#1B222D;--ink:#EEF1F6;--mute:#9AA4B5;--line:#2B3441;--field:#141A23;--key:#232C39;--ok:#4CC37C;--bad:#FF7B6B;--in:#4CC37C;--out:#FF8A7A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:17px;line-height:1.45;padding-bottom:40px;user-select:none;-webkit-user-select:none}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--pri);color:var(--onpri)}
.bar .ttl{font-size:22px;font-weight:900;letter-spacing:.06em}.bar .date{margin-left:auto;font-family:'Barlow Condensed';font-weight:600;font-size:20px;letter-spacing:.06em;opacity:.9}
.bar a,.bar button{border:0;background:rgba(255,255,255,.18);color:inherit;font:inherit;font-weight:700;border-radius:14px;height:46px;padding:0 16px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:14px 16px}
.modes{display:flex;gap:10px;padding:14px 16px 0;max-width:1000px;margin:0 auto}
.modes button{flex:1;height:64px;border:0;border-radius:18px;background:var(--card);color:var(--mute);font:inherit;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.modes button.on{background:var(--acc);color:#fff;box-shadow:none}
h3.sec{margin:20px 0 10px;font-size:15px;letter-spacing:.14em;color:var(--mute);font-weight:900}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;min-height:128px;border:0;border-radius:22px;background:var(--card);color:var(--ink);font:inherit;text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:none}
.tile .ic{width:42px;height:42px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--pri)}
.tile b{font-size:20px;font-weight:900;line-height:1.2}.tile small{display:block;color:var(--mute);font-size:13.5px;margin-top:2px}
.tile.acc{background:var(--acc);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}.tile.acc .ic{background:rgba(255,255,255,.22);color:#fff}.tile.acc small{color:rgba(255,255,255,.85)}
.tile.inn{background:var(--ok);color:#fff}.tile.inn .ic{background:rgba(255,255,255,.22);color:#fff}.tile.inn small{color:rgba(255,255,255,.88)}
.tile.dash{background:transparent;box-shadow:inset 0 0 0 2.5px var(--line);color:var(--mute);align-items:center;justify-content:center;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:0 3px 0 var(--line)}
.kpi small{display:block;color:var(--mute);font-weight:700;font-size:14px}.kpi b{font-family:'Barlow Condensed';font-weight:700;font-size:38px;line-height:1.1;letter-spacing:.02em}
.kpi.in b{color:var(--in)}.kpi.out b{color:var(--out)}
.card{background:var(--card);border-radius:20px;padding:6px 18px;box-shadow:0 3px 0 var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-size:18px}.li .m small{color:var(--mute);font-size:14px}
.li .a{font-family:'Barlow Condensed';font-weight:700;font-size:26px;white-space:nowrap}.a.in{color:var(--in)}.a.out{color:var(--out)}
.sm{height:42px;border:0;border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;padding:0 14px;cursor:pointer}
.sm.pri{background:var(--pri);color:var(--onpri)}.sm.acc{background:var(--acc);color:#fff}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--mute);margin-left:6px}.tag.warn{background:rgba(232,118,42,.18);color:var(--acc)}
.bars .row{display:flex;align-items:center;gap:12px;margin:10px 0}.bars .n{width:110px;font-weight:700;font-size:15px}.bars .t{flex:1;height:22px;background:var(--bg);border-radius:11px;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--pri);border-radius:11px}.bars .v{width:96px;text-align:right;font-family:'Barlow Condensed';font-weight:700;font-size:20px}
.mon{display:flex;align-items:center;gap:10px;margin-bottom:12px}.mon b{font-size:24px;font-family:'Barlow Condensed';letter-spacing:.06em;min-width:120px;text-align:center}
.empty{color:var(--mute);text-align:center;padding:26px 0}
.hidden{display:none!important}
.msg{margin:10px 0;padding:12px 14px;border-radius:14px;font-size:16px;display:none}.msg.bad{display:block;background:rgba(192,57,43,.13);color:var(--bad)}.msg.ok{display:block;background:rgba(30,125,69,.14);color:var(--ok)}
/* 記帳面板（全螢幕） */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.sh-top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);box-shadow:0 2px 0 var(--line)}
.sh-top .x{width:52px;height:52px;border:0;border-radius:16px;background:var(--bg);color:var(--ink);font-size:26px;font-weight:900;cursor:pointer}
.sh-top b{font-size:24px;font-weight:900}.sh-top small{display:block;color:var(--mute);font-size:14px}
.sh-body{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:16px;max-width:1000px;width:100%;margin:0 auto}
@media (max-width:760px){.sh-body{grid-template-columns:1fr}}
.amt{background:var(--card);border-radius:22px;padding:16px 20px;text-align:right;box-shadow:0 3px 0 var(--line)}.amt small{display:block;color:var(--mute);text-align:left;font-weight:700}
.amt b{font-family:'Barlow Condensed';font-weight:700;font-size:64px;line-height:1.1;letter-spacing:.02em}.amt b i{font-style:normal;font-size:26px;color:var(--mute);margin-right:8px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{height:52px;border:0;border-radius:16px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;font-weight:700;padding:0 18px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.chip.on{background:var(--pri);color:var(--onpri);box-shadow:none}.chip.q{font-family:'Barlow Condensed';font-size:22px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:76px;border:0;border-radius:18px;background:var(--key);color:var(--ink);font-family:'Barlow Condensed';font-size:36px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}.pad .del{color:var(--bad)}
.note{width:100%;height:54px;border-radius:16px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:17px;padding:0 16px;margin-top:12px;user-select:text;-webkit-user-select:text}
.go{width:100%;height:84px;border:0;border-radius:22px;background:var(--ok);color:#fff;font:inherit;font-size:26px;font-weight:900;margin-top:14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.go[disabled]{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:18px;font-weight:700;display:flex;align-items:center;gap:16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast button{border:0;background:var(--acc);color:#fff;border-radius:12px;height:40px;padding:0 16px;font:inherit;font-weight:900;cursor:pointer}
.ed{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 3px 0 var(--line);margin-top:14px}
.ed label{display:block;font-weight:900;font-size:14px;color:var(--mute);margin:12px 0 6px;letter-spacing:.06em}
.ed input,.ed select{width:100%;height:54px;border-radius:14px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:18px;padding:0 14px;user-select:text;-webkit-user-select:text}
.tax{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;background:var(--card);border-radius:16px;padding:10px 14px;font-weight:700}.tax input[type=text],.tax input:not([type]){width:130px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:20px;font-family:'Barlow Condensed';padding:0 10px;user-select:text;-webkit-user-select:text}.tax b{font-family:'Barlow Condensed';font-size:22px;color:var(--mute)}.tax label{display:flex;align-items:center;gap:6px;margin-left:auto}.tax input[type=checkbox]{width:22px;height:22px}
.iv{font-size:13.5px;color:var(--mute)}
svg.hl-icon{vertical-align:middle}
</style>
</head>
<body>
<div class="bar"><a id="home" target="_top" href="#" data-ic="arrow-left">主畫面</a><span class="ttl">店務收支</span><span class="date" id="today"></span></div>
<nav class="modes" id="modes">
  <button data-m="pos" class="on" data-ic="wallet">記帳</button><button data-m="today" data-ic="receipt">今日</button><button data-m="report" data-ic="trending-up" class="own">報表</button><button data-m="vendors" data-ic="truck" class="own">廠商</button>
</nav>
<div class="wrap">
  <div class="msg" id="gmsg"></div>

  <section id="v-pos">
    <div id="ordCard" class="hidden"><h3 class="sec">今天要叫貨</h3><div class="card" id="ordBody"></div></div>
    <h3 class="sec">固定廠商（點一下，輸入金額）</h3>
    <div class="tiles" id="vTiles"></div>
    <h3 class="sec">其他</h3>
    <div class="tiles" id="oTiles"></div>
  </section>

  <section id="v-today" class="hidden">
    <div class="kpis" id="tKpi"></div>
    <h3 class="sec">今天的明細</h3>
    <div class="card" id="tList"></div>
  </section>

  <section id="v-report" class="hidden">
    <div class="mon"><button class="sm" id="mPrev">‹ 上月</button><b id="mTitle"></b><button class="sm" id="mNext">下月 ›</button></div>
    <div class="kpis" id="rKpi"></div>
    <h3 class="sec">支出分類</h3><div class="card bars" id="rCat"></div>
    <h3 class="sec">廠商支出排行</h3><div class="card bars" id="rVen"></div>
    <h3 class="sec">採購人員</h3><div class="card bars" id="rBuy"></div>
    <h3 class="sec">統一發票（進項）</h3><div class="card" id="rInv"></div>
    <h3 class="sec">憑證正本還沒收到</h3><div class="card" id="rOrig"></div>
    <h3 class="sec">月結待付款</h3><div class="card" id="rUnpaid"></div>
    <h3 class="sec">本月明細</h3><div class="card" id="rList"></div>
    <div style="display:flex;gap:10px;margin-top:14px"><button class="sm pri" id="csv" data-ic="file-down">下載 CSV</button><button class="sm" id="csvCopy" data-ic="copy">複製 CSV</button></div>
  </section>

  <section id="v-vendors" class="hidden">
    <h3 class="sec">固定廠商設定</h3>
    <div class="card" id="vList"></div>
    <div class="ed" id="vEd">
      <b id="vEdT" style="font-size:20px">新增固定廠商</b>
      <label>廠商名稱</label><input id="vName" maxlength="12" placeholder="例如 阿財肉品">
      <label>預設分類</label><select id="vCat"></select>
      <label>預設付款方式</label><select id="vPay"></select>
      <label>常用金額（最多 4 個，用逗號隔開，記帳時一鍵帶入）</label><input id="vQuick" inputmode="numeric" placeholder="例如 1200, 2500, 4000">
      <label>叫貨日（前一天會寄信提醒你）</label><div class="chips" id="vDays" style="margin-top:0"></div>
      <div class="row2" style="display:flex;gap:10px"><div style="flex:1"><label>叫貨時間（幾點前要叫）</label><input type="time" id="vTime" value="15:00"></div><div style="flex:1"><label>負責叫貨的人</label><select id="vWho"></select></div></div>
      <label style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="vPin" style="width:26px;height:26px"> 設為常用廠商（排在最前面）</label>
      <div style="display:flex;gap:10px;margin-top:16px"><button class="sm pri" id="vSave" style="height:56px;flex:1;font-size:18px">儲存廠商</button><button class="sm" id="vReset" style="height:56px">清除</button></div>
      <div class="msg" id="vMsg"></div>
    </div>
  </section>
</div>

<div class="sheet hidden" id="sheet">
  <div class="sh-top"><button class="x" id="shX" aria-label="關閉">✕</button><div><b id="shT"></b><small id="shS"></small></div></div>
  <div class="sh-body">
    <div>
      <div class="amt"><small id="amtL">金額</small><b><i>NT$</i><span id="amt">0</span></b></div>
      <div class="chips" id="quick"></div>
      <div id="catBox" class="hidden"><h3 class="sec" style="margin-bottom:6px">分類</h3><div class="chips" id="cats" style="margin-top:0"></div></div>
      <h3 class="sec" style="margin-bottom:6px">付款方式</h3><div class="chips" id="pays" style="margin-top:0"></div>
      <h3 class="sec" style="margin-bottom:6px">日期</h3><div class="chips" id="dates" style="margin-top:0"></div>
      <div id="docBox">
        <h3 class="sec" style="margin-bottom:6px">憑證</h3><div class="chips" id="docs" style="margin-top:0"></div>
        <div id="invBox"><input class="note" id="inv" maxlength="12" autocomplete="off" placeholder="發票號碼，例如 AB12345678" style="text-transform:uppercase">
          <div class="tax"><span>應稅金額</span><input id="taxable" inputmode="numeric" maxlength="8"><span>稅額</span><b id="taxv">0</b><label><input type="checkbox" id="taxfree">免稅</label></div></div>
        <input class="note" id="items" maxlength="60" placeholder="購買品項，例如 雞腿肉 20 斤、蛋 5 箱">
        <div id="rcpBox" class="tax" style="margin-top:10px"><span>收據照片</span><input type="file" id="rcp" accept="image/*,application/pdf" style="width:auto;font-size:14px;height:auto;border:0"><small id="rcpN" class="iv"></small></div>
        <div class="chips" id="itemChips"></div>
        <h3 class="sec" style="margin-bottom:6px">採購人員</h3><div class="chips" id="buyers" style="margin-top:0"></div>
      </div>
      <input class="note" id="note" maxlength="40" placeholder="備註（選填）">
    </div>
    <div>
      <div class="pad" id="pad"><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="00">00</button><button data-k="0">0</button><button data-k="del" class="del">⌫</button></div>
      <div class="msg" id="shMsg"></div>
      <button class="go" id="go" disabled>記下這筆</button>
    </div>
  </div>
</div>
<div class="toast hidden" id="toast"><span id="toastT"></span><button id="undo">撤銷</button></div>

<script>

    if (E.type === '支出' && E.doc !== '無憑證') receipt = await toB64($('rcp').files[0]);
    const r = await run('lgAdd', { receipt: receipt, type: E.type, cat: E.cat, vendorId: E.vendor ? E.vendor.id : '', amount: E.amt, pay: E.pay, note: $('note').value, date: E.date, doc: E.doc, invoice: $('inv').value, items: $('items').value, buyer: E.buyer, taxable: E.taxEdited ? E.taxable : '', taxFree: E.taxFree, allowDup: E.allowDup }, TOKEN);
    const name = E.vendor ? E.vendor.name : (E.type === '收入' ? E.cat : E.cat);
    closeSheet(); LASTID = r.id; flash('已記　' + name + '　NT$ ' + money(E.amt));
    await load(true);
  } catch (er) {
    show($('shMsg'), 'bad', er.message);
    if (/已經記過/.test(er.message)) { E.allowDup = true; $('go').textContent = '仍要記帳（發票號碼重複）'; }
    $('go').disabled = false;
  }
};
function flash(t) {
  $('toastT').textContent = t; $('toast').classList.remove('hidden'); clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { $('toast').classList.add('hidden'); LASTID = ''; }, 10000);
}
$('undo').onclick = async () => {
  if (!LASTID) return; const id = LASTID; LASTID = ''; $('toast').classList.add('hidden');
  try { await run('lgDelete', id, TOKEN); show($('gmsg'), 'ok', '已撤銷'); await load(true); } catch (e) { show($('gmsg'), 'bad', e.message); }
};

/* ---------- 今日 ---------- */
function entryRow(e, del) {
  const sign = e.type === '收入' ? 'in' : 'out';
  return `<div class="li"><span class="ic" style="color:var(--${sign})">${ic(e.type === '收入' ? 'banknote' : 'wallet', 28)}</span><div class="m"><b>${esc(e.vendor || e.cat)}</b><small>${esc(e.cat)}・${esc(e.pay)}${e.pay === '月結' ? (e.paid ? '（已結清）' : '（未付）') : ''}${e.note ? '・' + esc(e.note) : ''}${e.d !== ST.today ? '・' + esc(md(e.d)) : ''}</small>${e.type === '支出' && (e.inv || e.items || e.buyer) ? `<small class="iv">${e.inv ? '發票 ' + esc(e.inv) + (e.taxable != null ? '（應稅 ' + money(e.taxable) + '・稅 ' + money(e.tax) + '）' : '') + '　' : ''}${e.items ? esc(e.items) + '　' : ''}${e.buyer ? '採購 ' + esc(e.buyer) : ''}</small>` : ''}${e.type === '支出' && e.orig ? `<small class="iv">${e.hasFile ? '有收據照片　' : ''}憑證正本：<b style="color:var(--${e.orig === '已收到' ? 'ok' : 'acc'})">${esc(e.orig)}</b></small>` : ''}</div><div class="a ${sign}">${e.type === '收入' ? '+' : '−'}${money(e.amt)}</div>${ST.owner && e.type === '支出' && e.orig ? `<button class="sm" data-orig="${esc(e.id)}" data-got="${e.orig === '已收到' ? '' : '1'}">${e.orig === '已收到' ? '改為未收到' : '已收到正本'}</button>` : ''}${ST.owner && e.hasFile ? `<button class="sm" data-rc="${esc(e.id)}">看收據</button>` : ''}${del ? `<button class="sm" data-del="${esc(e.id)}">刪除</button>` : ''}</div>`;
}
function drawToday() {
  const s = ST.todaySum;
  $('tKpi').innerHTML = `<div class="kpi in"><small>今日收入</small><b>${money(s.inn)}</b></div><div class="kpi out"><small>今日支出</small><b>${money(s.out)}</b></div><div class="kpi"><small>今日淨額</small><b>${s.net < 0 ? '−' : ''}${money(Math.abs(s.net))}</b></div>`;
  $('tList').innerHTML = ST.entries.length ? ST.entries.slice().reverse().map(e => entryRow(e, true)).join('') : '<div class="empty">今天還沒有記帳</div>';
}
async function origClick(e) {
  const o = e.target.closest('[data-orig]'), r = e.target.closest('[data-rc]');
  if (o) { try { await run('lgSetOriginal', o.dataset.orig, !!o.dataset.got, TOKEN); await load(true); await loadReport(); } catch (er) { show($('gmsg'), 'bad', er.message); } return true; }
  if (r) { try { const u = await run('lgReceiptUrl', r.dataset.rc, TOKEN); window.open(u.url, '_blank'); } catch (er) { show($('gmsg'), 'bad', er.message); } return true; }
}
async function delClick(e, box) {
  if (await origClick(e)) return;
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '確定？'; b.classList.add('acc'); setTimeout(() => { b.dataset.sure = ''; b.textContent = '刪除'; b.classList.remove('acc'); }, 3000); return; }
  try { await run('lgDelete', b.dataset.del, TOKEN); await load(true); } catch (er) { show($('gmsg'), 'bad', er.message); }
}
$('tList').onclick = e => delClick(e);

/* ---------- 報表（店主） ---------- */
async function loadReport() { try { ST.report = await run('lgReport', YM, TOKEN); drawReport(); } catch (e) { show($('gmsg'), 'bad', e.message); } }
function bars(box, list, color) {
  const max = Math.max(1, ...list.map(x => x.amt));
  box.innerHTML = list.length ? list.map(x => `<div class="row"><span class="n">${esc(x.name.replace('進貨：', '進貨・'))}</span><span class="t"><i style="width:${Math.max(3, x.amt / max * 100)}%${color ? ';background:' + color : ''}"></i></span><span class="v">${money(x.amt)}</span></div>`).join('') : '<div class="empty">這個月沒有資料</div>';
}
function drawReport() {
  const R = ST.report; if (!R) return;
  $('mTitle').textContent = R.month.replace('-', ' / ');
  const s = R.sum;
  $('rKpi').innerHTML = `<div class="kpi in"><small>收入</small><b>${money(s.inn)}</b></div><div class="kpi out"><small>支出</small><b>${money(s.out)}</b></div><div class="kpi"><small>淨額</small><b>${s.net < 0 ? '−' : ''}${money(Math.abs(s.net))}</b></div><div class="kpi"><small>月結待付</small><b style="color:var(--acc)">${money(R.unpaid.reduce((a, x) => a + x.amt, 0))}</b></div>`;
  bars($('rCat'), R.byCat); bars($('rVen'), R.byVendor, 'var(--acc)'); bars($('rBuy'), R.byBuyer || [], '#6B7486');
  const iv = R.invoice || { n: 0, taxable: 0, tax: 0, total: 0 };
  $('rInv').innerHTML = iv.n ? `<div class="kpis" style="margin:12px 0"><div class="kpi"><small>發票張數</small><b>${iv.n}</b></div><div class="kpi"><small>含稅合計</small><b>${money(iv.total)}</b></div><div class="kpi"><small>應稅金額</small><b>${money(iv.taxable)}</b></div><div class="kpi"><small>進項稅額</small><b style="color:var(--acc)">${money(iv.tax)}</b></div></div>` : '<div class="empty">這個月沒有登記統一發票</div>';
  $('rUnpaid').innerHTML = R.unpaid.length ? R.unpaid.map(u => `<div class="li"><span class="ic">${ic('receipt', 28)}</span><div class="m"><b>${esc(u.name)}</b><small>${u.n} 筆月結未付</small></div><div class="a out">${money(u.amt)}</div><button class="sm pri" data-settle="${esc(u.vid)}" ${u.vid ? '' : 'disabled'}>全部結清</button></div>`).join('') : '<div class="empty">沒有未付的月結</div>';
  $('rOrig').innerHTML = (R.origPending || []).length ? R.origPending.map(e => entryRow(e, false)).join('') : '<div class="empty">統一發票與收據的正本都收齊了</div>';
  $('rList').innerHTML = R.entries.length ? R.entries.map(e => entryRow(e, true)).join('') : '<div class="empty">這個月沒有明細</div>';
}
$('rList').onclick = e => delClick(e);
$('rOrig').onclick = e => origClick(e);
$('rUnpaid').onclick = async e => {
  const b = e.target.closest('[data-settle]'); if (!b) return;
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '確定結清？'; setTimeout(() => { b.dataset.sure = ''; b.textContent = '全部結清'; }, 3000); return; }
  try { const r = await run('lgSettle', b.dataset.settle, [], TOKEN); show($('gmsg'), 'ok', '已結清 ' + r.settled + ' 筆'); await load(true); } catch (er) { show($('gmsg'), 'bad', er.message); }
};
const shiftMonth = n => { const [y, m] = (YM || ST.today.slice(0, 7)).split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); YM = d.toISOString().slice(0, 7); loadReport(); };
$('mPrev').onclick = () => shiftMonth(-1); $('mNext').onclick = () => shiftMonth(1);
function csvText() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const L = [['日期', '類型', '分類', '廠商', '含稅金額', '付款方式', '結清', '憑證', '發票號碼', '購買品項', '應稅金額', '稅額', '採購人員', '備註'].map(q).join(',')];
  ST.report.entries.slice().reverse().forEach(e => L.push([e.d, e.type, e.cat, e.vendor, e.amt, e.pay, e.pay === '月結' ? (e.paid ? '是' : '否') : '', e.doc, e.inv, e.items, e.taxable == null ? '' : e.taxable, e.doc === '統一發票' ? e.tax : '', e.buyer, e.note].map(q).join(',')));
  return L.join('\r\n');
}
$('csv').onclick = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csvText()], { type: 'text/csv;charset=utf-8' })); a.download = '收支_' + ST.report.month + '.csv'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { show($('gmsg'), 'bad', '這個瀏覽器不能直接下載，請改用「複製 CSV」'); } };
$('csvCopy').onclick = async () => { try { await navigator.clipboard.writeText(csvText()); show($('gmsg'), 'ok', '已複製，可貼到 Excel 或 Google 試算表'); } catch (e) { show($('gmsg'), 'bad', '複製失敗'); } };

/* ---------- 廠商設定（店主） ---------- */
function drawVendors() {
  drawVDays();
  $('vWho').innerHTML = '<option value="">只通知店主</option>' + (ST.assignees || []).map(n => `<option>${esc(n)}</option>`).join('');
  $('vCat').innerHTML = ST.outCats.map(c => `<option>${esc(c)}</option>`).join(''); $('vPay').innerHTML = ST.pays.map(c => `<option>${esc(c)}</option>`).join('');
  $('vList').innerHTML = ST.vendors.length ? ST.vendors.map(v => `<div class="li"><span class="ic">${ic('truck', 28)}</span><div class="m"><b>${esc(v.name)}</b><small>${esc(v.cat)}・${esc(v.pay)}${v.quick.length ? '・常用 ' + v.quick.map(money).join(' / ') : ''}${v.pin ? '・★常用' : ''}${v.orderDays && v.orderDays.length ? '・叫貨日 週' + v.orderDays.map(d => WD[d]).join('、') + ' ' + esc(v.time || '') + (v.assignee ? '・' + esc(v.assignee) : '') : ''}</small></div><button class="sm" data-ve="${esc(v.id)}">編輯</button><button class="sm" data-vd="${esc(v.id)}">停用</button></div>`).join('') : '<div class="empty">還沒有固定廠商，在下面新增第一家</div>';
}
$('vList').onclick = async e => {
  const ed = e.target.closest('[data-ve]'), dl = e.target.closest('[data-vd]');
  if (ed) { const v = ST.vendors.find(x => x.id === ed.dataset.ve); VEDIT = v.id; $('vEdT').textContent = '編輯：' + v.name; $('vName').value = v.name; $('vCat').value = v.cat; $('vPay').value = v.pay; $('vQuick').value = v.quick.join(', '); $('vPin').checked = !!v.pin; $('vTime').value = v.time || '15:00'; $('vWho').value = v.assignee || ''; VDAYS = (v.orderDays || []).slice(); drawVDays(); $('vEd').scrollIntoView({ behavior: 'smooth' }); }
  if (dl) {
    if (dl.dataset.sure !== '1') { dl.dataset.sure = '1'; dl.textContent = '確定停用？'; setTimeout(() => { dl.dataset.sure = ''; dl.textContent = '停用'; }, 3000); return; }
    try { ST.vendors = await run('lgVendorDelete', dl.dataset.vd, TOKEN); await load(true); } catch (er) { show($('gmsg'), 'bad', er.message); }
  }
};
function drawVDays() { $('vDays').innerHTML = [1, 2, 3, 4, 5, 6, 0].map(d => `<button class="chip${VDAYS.indexOf(d) >= 0 ? ' on' : ''}" data-vd2="${d}">週${WD[d]}</button>`).join(''); }
$('vDays').onclick = e => { const b = e.target.closest('[data-vd2]'); if (!b) return; const d = Number(b.dataset.vd2), i = VDAYS.indexOf(d); if (i >= 0) VDAYS.splice(i, 1); else VDAYS.push(d); drawVDays(); };
function vReset() { VEDIT = ''; VDAYS = []; $('vPin').checked = false; $('vTime').value = '15:00'; $('vWho').value = ''; drawVDays(); $('vEdT').textContent = '新增固定廠商'; $('vName').value = ''; $('vQuick').value = ''; $('vMsg').className = 'msg'; }
$('vReset').onclick = vReset;
$('vSave').onclick = async () => {
  try { await run('lgVendorSave', { id: VEDIT, name: $('vName').value, cat: $('vCat').value, pay: $('vPay').value, quick: $('vQuick').value, pin: $('vPin').checked, orderDays: VDAYS, orderTime: $('vTime').value, assignee: $('vWho').value }, TOKEN); show($('vMsg'), 'ok', '已儲存'); vReset(); await load(true); }
  catch (e) { show($('vMsg'), 'bad', e.message); }
};
window.__hlEnd = true;
</script>
</body>
</html>
